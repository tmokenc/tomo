[package]
name = "tomo-frontend"
version = "0.1.0"
edition = "2024"
license = "MIT"

# Independent crate — NOT a workspace member. Built with `trunk build` to
# produce `dist/`. The tomo-admin service serves the contents of `dist/`.

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
yew         = { version = "0.23", features = ["csr"] }
yew-router  = "0.20"
gloo-net    = { version = "0.7", default-features = false, features = ["http", "json"] }
gloo-timers = { version = "0.3", features = ["futures"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
thiserror   = "2"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys      = { version = "0.3", features = ["Window", "Location", "HtmlElement"] }
js-sys       = "0.3"
log          = "0.4"
wasm-logger  = "0.2"

[profile.release]
opt-level = "s"
lto       = true
codegen-units = 1
panic     = "abort"
strip     = true
