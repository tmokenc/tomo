[package]
name = "tomo-requester"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

# Thin, async HTTP clients for the public APIs that Tomo's commands talk to.
# One module per service; one `Requester` struct that owns the shared
# `reqwest::Client`. No HTTP-client gymnastics, no scraper-vs-API toggles —
# the old `tomoka-rs/requester` was sprawling for not very much gain.

[dependencies]
chrono     = { workspace = true }
regex      = { workspace = true }
reqwest    = { workspace = true }
scraper    = { workspace = true }
serde      = { workspace = true }
serde_json = { workspace = true }
thiserror  = { workspace = true }
tracing    = { workspace = true }
